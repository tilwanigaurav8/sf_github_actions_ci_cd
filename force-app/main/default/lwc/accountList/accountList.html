<template>
    <template if:true={errors}>
        <p>Errors: {errors}</p>
    </template>
    <template if:false={errors}>
        <lightning-card>
            <template if:true={accounts.data}>
                <lightning-datatable
                    key-field="Id"
                    data={accounts.data}
                    columns={columns}
                >
            </lightning-datatable>
            </template>
        </lightning-card>
    </template>
</template>
